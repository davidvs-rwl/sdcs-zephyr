# --- Sensor UART (UARTE2 @ 9600 8N1) ---
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# --- Console on VCOM0 ---
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y   # needed for the %f ppm column

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Sizing ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=1024

# --- Modem stays off for milestone 1 ---
# Add CONFIG_NRF_MODEM_LIB=y and the LTE link control options later.
