# Sysbuild configuration.
#
# MCUboot is not optional on this target, despite nothing here needing DFU.
#
# The nRF9151-DK ns board pulls in zephyr/dts/vendor/nordic/nrf91xx_partition.dtsi
# via `zephyr,code-partition = &slot0_ns_partition`. That file hardcodes the
# TF-M "with BL2" flash layout:
#
#   0x00000000  BL2 - MCUboot            (64 KB)
#   0x00010000  secure image primary     (256 KB)
#   0x00050000  non-secure image primary (192 KB)
#
# The secure and non-secure images are therefore linked at 0x10000 and 0x50000,
# leaving the 64 KB at the reset vector for a bootloader. Without this option
# sysbuild never builds one, `west flash` writes only the two image regions, and
# the CPU resets into whatever happens to be at 0x0 -- erased flash, or a stale
# image from a previous project. It builds and flashes clean and then hangs
# before reaching TF-M, with a blank console and no other symptom.
#
# Enabling MCUboot fills 0x0 and signs the images so it will accept them.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
